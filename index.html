<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayanokōji Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body {
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: #0d1420;
            border: 1px solid #2c3a5a;
            border-radius: 20px;
            padding: 1.5rem;
        }
        h1 {
            color: #aaffff;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
        }
        h1 span { color: #7a5cff; font-weight: 600; }
        .subtitle {
            text-align: center;
            color: #6a6a8a;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .chat-box {
            height: 320px;
            overflow-y: auto;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 1rem;
            margin: 1rem 0;
            background: #0a1525;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .msg {
            max-width: 85%;
            padding: 0.5rem 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: #1a2a4a;
            color: #d0d8e8;
        }
        .msg.bot {
            align-self: flex-start;
            background: #0f1a2a;
            border: 1px solid #2c3a5a;
            color: #c8d8e8;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .input-area input {
            flex: 1;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1px solid #2c4a6a;
            background: #0a1525;
            color: white;
        }
        .input-area input:focus {
            outline: none;
            border-color: #7a5cff;
        }
        .input-area button {
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2a1a5a, #4a2a7a);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .input-area button:hover {
            background: #3a2a6a;
        }
        .file-area {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .file-area input[type="file"] {
            flex: 1;
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid #2c4a6a;
            background: #0a1525;
            color: #aaffff;
            min-width: 130px;
        }
        .file-area select {
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid #2c4a6a;
            background: #0a1525;
            color: white;
            min-width: 90px;
        }
        .file-area button {
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 12px;
            background: #2a4a6a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .file-area button:hover {
            background: #3a5a8a;
        }
        .result {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 8px;
            background: #0a1525;
            border: 1px solid #2c4a6a;
            font-size: 0.85rem;
            color: #aaffff;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .status {
            font-size: 0.8rem;
            color: #6a6a8a;
            text-align: center;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ <span>SHADOW</span> ARISE</h1>
        <p class="subtitle">Ayanokōji Digital · Control Total</p>

        <div class="chat-box" id="chatMessages">
            <div class="msg bot">Agente listo. Esperando órdenes.</div>
        </div>

        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Escribe tu mensaje...">
            <button id="sendBtn">Enviar</button>
        </div>

        <div class="file-area">
            <input type="file" id="fileInput">
            <select id="destinoSelect">
                <option value="agente">Agente</option>
                <option value="test">Test</option>
                <option value="shadow">Shadow</option>
            </select>
            <button id="uploadBtn">Subir</button>
            <button id="resumirBtn" style="background:#2a4a6a">Resumir</button>
        </div>

        <div id="resultado" class="result">Esperando comandos...</div>
        <div class="status" id="status">Conectado</div>
    </div>

    <script>
        // ==================================================
        // CONFIGURACIÓN
        // ==================================================
        const WORKER_URL = 'https://shadow-ayano.yeinierliranzavalle.workers.dev';

        // ==================================================
        // ELEMENTOS DEL DOM
        // ==================================================
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const resumirBtn = document.getElementById('resumirBtn');
        const destinoSelect = document.getElementById('destinoSelect');
        const resultadoDiv = document.getElementById('resultado');
        const statusDiv = document.getElementById('status');

        // ==================================================
        // FUNCIONES AUXILIARES
        // ==================================================
        function addMsg(tipo, texto) {
            const div = document.createElement('div');
            div.className = 'msg ' + tipo;
            div.textContent = texto;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function setResultado(texto) {
            resultadoDiv.textContent = texto;
        }

        // ==================================================
        // CHAT
        // ==================================================
        async function enviarMensaje() {
            const texto = chatInput.value.trim();
            if (!texto) return;

            addMsg('user', texto);
            chatInput.value = '';
            chatInput.disabled = true;
            sendBtn.disabled = true;
            statusDiv.textContent = '⏳ Procesando...';

            try {
                const res = await fetch(WORKER_URL + '/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: texto })
                });
                const data = await res.json();
                addMsg('bot', data.respuesta || '⚠️ Error desconocido.');
            } catch (e) {
                addMsg('bot', '⚠️ Error de conexión.');
            }

            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.focus();
            statusDiv.textContent = 'Conectado';
        }

        sendBtn.onclick = enviarMensaje;
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        // ==================================================
        // SUBIR ARCHIVO
        // ==================================================
        uploadBtn.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) {
                setResultado('❌ Selecciona un archivo.');
                return;
            }

            const formData = new FormData();
            formData.append('archivo', file);
            formData.append('nombre', file.name);
            formData.append('destino', destinoSelect.value);

            setResultado('⏳ Subiendo...');

            try {
                const res = await fetch(WORKER_URL + '/api/subir', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                setResultado(data.mensaje ? '✅ ' + data.mensaje : '❌ ' + data.error);
            } catch (e) {
                setResultado('❌ Error al subir.');
            }
        };

        // ==================================================
        // RESUMIR
        // ==================================================
        resumirBtn.onclick = async () => {
            const input = prompt('Ingresa el texto a resumir o el ID del archivo (formato: file:ID)');
            if (!input) return;

            setResultado('⏳ Generando resumen...');

            try {
                let body = { texto: input, destino: destinoSelect.value };
                if (input.startsWith('file:')) {
                    body = { archivoId: input.replace('file:', ''), destino: destinoSelect.value };
                }

                const res = await fetch(WORKER_URL + '/api/resumir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (data.fases) {
                    setResultado('📋 Fases:\n' + data.fases.map((f, i) => (i + 1) + '. ' + f).join('\n'));
                } else {
                    setResultado('❌ ' + (data.error || 'Error al resumir.'));
                }
            } catch (e) {
                setResultado('❌ Error de conexión.');
            }
        };
    </script>
</body>
  </html>
